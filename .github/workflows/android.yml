name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Put the current app page into the APK (offline fallback)
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/index.html android/app/src/main/assets/index.html

      - name: Build APK
        env:
          VELEZ_KEYSTORE: ${{ github.workspace }}/android/velez-release.p12
          VELEZ_KEYSTORE_PASSWORD: ${{ secrets.VELEZ_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          if [ -z "$VELEZ_KEYSTORE_PASSWORD" ]; then
            # Without the signing secret only check that the code builds; nothing is published.
            echo "::warning::Secret VELEZ_KEYSTORE_PASSWORD is missing (Settings > Secrets and variables > Actions): debug build only, no release."
            echo "SIGNED=no" >> "$GITHUB_ENV"
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build.log
          else
            echo "SIGNED=yes" >> "$GITHUB_ENV"
            ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build.log
          fi

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE "error:|e: |FAILURE|What went wrong|Exception|^> " build.log | head -60 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            echo "----- last lines of the build log -----"
            tail -150 build.log
          fi

      - name: Check APK signature
        if: env.SIGNED == 'yes'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-cert.txt
          "$BT/aapt2" dump badging "$APK" | head -5 | tee -a apk-cert.txt
          cp "$APK" velez-semafor.apk
          sha256sum velez-semafor.apk | tee velez-semafor.apk.sha256

      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'yes'
        with:
          name: velez-semafor-apk
          path: |
            velez-semafor.apk
            velez-semafor.apk.sha256
            apk-cert.txt

      - name: Publish GitHub release
        if: env.SIGNED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(sed -nE "s/^\s*versionName\s+'([^']+)'.*/\1/p" android/app/build.gradle | head -1)
          CODE=$(sed -nE "s/^\s*versionCode\s+([0-9]+).*/\1/p" android/app/build.gradle | head -1)
          TAG="v$NAME"
          NOTES=$(jq -r --arg v "$NAME" '([.changelog[] | select(.version == $v)][0] // .changelog[0]) | "**" + .title + "**\n\n" + ([.items[] | "- " + .] | join("\n"))' docs/data/app.json)
          printf '%s\n\nPreuzmi **velez-semafor.apk** ispod i otvori ga na telefonu (Android 7 ili noviji). Nova verzija se instalira preko postojeće, podaci ostaju.\n\nVerzija %s (build %s).\n' "$NOTES" "$NAME" "$CODE" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" velez-semafor.apk velez-semafor.apk.sha256 --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" velez-semafor.apk velez-semafor.apk.sha256 --title "Velež Semafor $NAME" --notes-file notes.md --latest
          fi
